name: Mantener backend despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf --max-time 30 https://educampus-backend-rwz6.onrender.com/health || echo "El backend no respondio a tiempo (probablemente estaba despertando)"
